map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

server {
    listen 80;
    server_name askvalentina.co.uk www.askvalentina.co.uk;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name askvalentina.co.uk www.askvalentina.co.uk;

    ssl_certificate /etc/letsencrypt/live/askvalentina.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/askvalentina.co.uk/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # API & WebSocket proxy to backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Keep long-lived WebSockets (chat + notifications) open — the default
        # 60s read timeout would silently drop idle sockets between pings.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Content-hashed build assets. Vite emits /assets/*-<hash>.{js,css,…} whose
    # filename changes whenever the content changes, so they are safe to cache
    # forever. `immutable` tells browsers not to even revalidate.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # HTML is NOT content-hashed. It must be revalidated on every request —
    # otherwise a new deploy's index.html (which points at the new hashed
    # bundles) stays cached and visitors keep loading stale JS/CSS until they
    # manually hard-refresh. `no-cache` = the browser may store it but must
    # revalidate with the server before use, so a redeploy is picked up at once.
    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
    }

    # Branded 404 for genuinely missing files (prerendered at build time to
    # dist/404.html). Returned with a real 404 status.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
    }

    # SPA fallback. Unknown paths serve index.html, which carries the no-cache
    # header above via the internal redirect into the \.html$ location. Prerendered
    # content routes (e.g. /does-he-miss-me/index.html) are matched by $uri/ before
    # this fallback, so crawlers get the real per-page HTML.
    location / {
        try_files $uri $uri/ /index.html;
    }
}