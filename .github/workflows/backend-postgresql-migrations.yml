name: Backend PostgreSQL migrations

on:
  pull_request:
    paths:
      - "TAROT-BACKEND/**"
      - ".github/workflows/backend-postgresql-migrations.yml"
  push:
    branches: [main]
    paths:
      - "TAROT-BACKEND/**"
      - ".github/workflows/backend-postgresql-migrations.yml"
  workflow_dispatch:

concurrency:
  group: backend-postgresql-migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migration-lifecycle:
    name: Upgrade, downgrade, re-upgrade, schema parity
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tarot
          POSTGRES_PASSWORD: migration-test-only
          POSTGRES_DB: tarot_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tarot -d tarot_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    defaults:
      run:
        working-directory: TAROT-BACKEND

    env:
      DATABASE_URL: postgresql://tarot:migration-test-only@127.0.0.1:5432/tarot_migration_test
      MIGRATION_TEST_CONFIRM_DISPOSABLE: "YES"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install backend
        run: python -m pip install .
      - name: Verify PostgreSQL migration lifecycle serially
        run: python scripts/verify_postgres_migrations.py
