name: Diagnose superadmin (read-only)

# One-off, manual, READ-ONLY diagnostic: does the superadmin account exist on
# production, and what is its email / role / verified / status? It NEVER reads
# or prints the password hash. Delete this workflow after use.
on:
  workflow_dispatch:

jobs:
  diagnose:
    name: Read-only account check over SSH
    runs-on: ubuntu-latest
    steps:
      - name: Query the production DB (SELECT only, no password hash)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          timeout: 60s
          script_stop: true
          script: |
            cd /root/TAROT
            echo "==== superadmin@tarot.com row (no password_hash) ===="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T postgres \
              psql -U tarot -d tarot -c \
              "SELECT username, email, role::text AS role, is_verified, status::text AS status, created_at FROM users WHERE email ILIKE 'superadmin@tarot.com' OR username = 'superadmin';"
            echo "==== all ADMIN / SUPERADMIN accounts (emails only, no secrets) ===="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T postgres \
              psql -U tarot -d tarot -c \
              "SELECT email, role::text AS role, is_verified, status::text AS status FROM users WHERE role::text IN ('ADMIN','SUPERADMIN') ORDER BY role;"
            echo "==== counts by role ===="
            docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T postgres \
              psql -U tarot -d tarot -c \
              "SELECT role::text AS role, count(*) FROM users GROUP BY role::text ORDER BY role;"
