[pytest]
# Test config lives here (not in pyproject.toml) so it never touches the
# uv dependency lock the Docker build installs with `uv export --frozen`.
# pytest is a local-only dev tool and is deliberately NOT a runtime dependency.
testpaths = tests
filterwarnings =
    # SQLite (test DB only) warns that it stores DateTime without timezone; the
    # ledger logic compensates and Postgres is unaffected.
    ignore::sqlalchemy.exc.SAWarning
