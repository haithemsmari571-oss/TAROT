map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

# No nginx version in the Server header or on nginx's own error pages.
server_tokens off;

# The Cache-Control of every answer, by address, in one place. nginx sends no
# header whose value is empty, so "" means none: the API, the articles and the
# CRM keep their own. Build files under /assets/ carry a hash of their content
# in their name, so they are kept for a year and never rechecked. HTML, the
# service worker and the manifest are rechecked on every load, so a release
# shows at once. $uri is the address after try_files and error_page, so the
# index.html fallback and the 404 page count as HTML.
map $uri $av_cache_control {
    default                "";
    ~^/assets/             "public, max-age=31536000, immutable";
    ~^/media/              "public, max-age=31536000, immutable";
    ~*\.html$              "no-cache";
    /sw.js                 "no-cache";
    /manifest.webmanifest  "no-cache";
}

# HTTPS only, for a year, on this host (not its subdomains; no preload list).
map $host $av_hsts {
    default "max-age=31536000";
}

server {
    listen 80;
    server_name askvalentina.co.uk www.askvalentina.co.uk;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    # HTTP/2 over TLS: a page's many small script files share one connection
    # instead of six at a time. The directive form (nginx 1.25.1 and later)
    # replaces the deprecated "listen ... http2". WebSockets still open over
    # HTTP/1.1, which nginx negotiates on their own connection.
    http2 on;
    server_name askvalentina.co.uk www.askvalentina.co.uk;

    ssl_certificate /etc/letsencrypt/live/askvalentina.co.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/askvalentina.co.uk/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Text goes out compressed: the scripts, styles, HTML, SVG, JSON and the
    # manifest, static and proxied alike (the API's JSON, the articles, the
    # sitemap). nginx:alpine has no brotli module, so gzip only. Level 6 is
    # where the size stops falling much; under 1 KB the gzip framing costs more
    # than it saves. text/html is always compressed once gzip is on. Media,
    # fonts and images are already compressed, and the Iris stream
    # (text/event-stream) is not on the list, so it is never held back.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css text/plain text/xml text/javascript application/javascript application/json application/xml application/manifest+json application/rss+xml image/svg+xml;

    # The site's headers, on every answer of every location below that adds no
    # header of its own (nginx drops the server's add_header lines in any
    # location that has one). Content-Security-Policy is a later job.
    add_header Cache-Control $av_cache_control always;
    add_header Strict-Transport-Security $av_hsts always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /crm {
        return 301 /crm/;
    }

    location ^~ /crm/ {
        # The CRM sends its own, stricter headers (no-referrer, DENY and a CSP
        # of its own). This one add_header is what stops the site's set above
        # from being added on top of them; it keeps only HTTPS-only.
        add_header Strict-Transport-Security $av_hsts always;

        # Iris long-video contract: nginx `20g` equals the CRM's 20 * 1024^3
        # byte limit. Stream the request upstream instead of buffering a second
        # complete copy on nginx disk before the CRM can receive it.
        client_max_body_size 20g;
        proxy_request_buffering off;

        proxy_pass http://atlas:4317;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Iris MCP — the streamable HTTP transport Anthropic's cloud connects to.
    #
    # The whole service hides behind a 32-byte random path segment, compared in
    # constant time by the app; every wrong secret and every unknown path under
    # this prefix returns a bare 404 with an empty body, indistinguishable from
    # each other. nginx deliberately adds no auth of its own: a second gate here
    # could only ever be weaker than the one the app already enforces, and it
    # would leak the service's existence through its own error pages.
    location ^~ /iris-mcp/ {
        proxy_pass http://iris-mcp:4319;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        # Reuses the map at the top of this file. With no Upgrade header it
        # yields "", which is exactly what a Server-Sent Events stream needs.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # MCP streamable HTTP answers some requests as an SSE stream. Buffering
        # would hold each event until the buffer filled, which for a stream that
        # is idle between tool calls means the client sees nothing at all.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # A tool call may sit on a slow CRM route; the app's own ceiling is 30s
        # per CRM call, so this only needs to outlive that comfortably.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # API & WebSocket proxy to backend
    location /api/ {
        # Audio uploads go directly to R2. This ceiling leaves room for the
        # backend's 8 MB image uploads and multipart form overhead without
        # turning the general API proxy into an unbounded upload endpoint.
        client_max_body_size 25m;

        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Keep long-lived WebSockets (chat + notifications) open — the default
        # 60s read timeout would silently drop idle sockets between pings.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /media/ {
        # TEMPORARY: relays library media through our own server because the R2
        # bucket is still on Cloudflare's rate-limited r2.dev development
        # endpoint, which stalls on large audio files. Remove this block once the
        # bucket is behind a custom domain and set R2_PUBLIC_BASE_URL back.
        proxy_pass https://pub-3ca57f9794dc41c79fa21813e1e36ca6.r2.dev/;
        proxy_ssl_server_name on;
        proxy_set_header Host pub-3ca57f9794dc41c79fa21813e1e36ca6.r2.dev;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass_request_headers on;
        proxy_hide_header Set-Cookie;
        proxy_hide_header x-amz-request-id;
        proxy_hide_header x-amz-id-2;
    }

    # Dynamic editorial SEO: anonymous requests receive complete article HTML
    # and a database-backed sitemap. Draft/archived rows are excluded upstream.
    location = /sitemap.xml {
        proxy_pass http://backend:8000/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /articles/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Content-hashed build assets. Vite emits /assets/*-<hash>.{js,css,…} whose
    # filename changes whenever the content changes, so they are safe to cache
    # forever ($av_cache_control above: `immutable` tells browsers not to even
    # revalidate).
    location /assets/ {
        try_files $uri =404;
    }

    # HTML is NOT content-hashed. It must be revalidated on every request —
    # otherwise a new deploy's index.html (which points at the new hashed
    # bundles) stays cached and visitors keep loading stale JS/CSS until they
    # manually hard-refresh. `no-cache` ($av_cache_control above) = the browser
    # may store it but must revalidate with the server before use, so a
    # redeploy is picked up at once.
    location ~* \.html$ {
    }

    # Branded 404 for unknown addresses and missing files (prerendered at build
    # time to dist/404.html). Returned with a real 404 status, no-cache like all HTML.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # MCP clients probe these to discover an OAuth sign-in service. There is
    # none — iris-mcp authenticates by secret path — and the SPA catch-all
    # answering 200 here makes claude.ai attempt OAuth and fail. Real 404s
    # make clients fall back to connecting without auth.
    location ~ ^/\.well-known/(oauth-authorization-server|oauth-protected-resource|openid-configuration) {
        return 404;
    }

    # Real 404s. Only the app's own addresses get index.html: the routes in
    # src/App.tsx and src/routes/*.routes.ts, each with or without a trailing
    # slash, ids as digits, tokens and slugs as one path segment. React Router
    # matches without regard to case, so this does too. index.html carries the
    # no-cache header above ($uri is /index.html after try_files). A new route
    # in the app needs its address added here, or nginx answers it 404.
    location ~* "^/(?:|home|login|register|forgot-password|verify-account|psychics-browse|about|privacy|terms|oracle|sanctuary|billing|profile|notifications|chats|design-preview|reset-password/[^/]+|verify-email/[^/]+|psychics/[0-9]+/details|chats/[0-9]+|reading/new/[0-9]+|admin(?:/.*)?|app(?:/(?:home|home/read/[^/]+|readers|readers/[0-9]+|shorts|chats|chats/[0-9]+|you|you/(?:details|password|favourites|delete|constellation|notifications|terms|privacy|help)))?)/?$" {
        try_files /index.html =404;
    }

    # The prerendered pages (dist/<page>/index.html) answer 200 at their
    # canonical address, with no trailing slash (src/seo/seoData.ts
    # canonicalUrl), and at the slashed one, with no redirect between them.
    location ~ "^/(does-he-miss-me|will-my-ex-come-back)/?$" {
        try_files /$1/index.html =404;
    }

    # Everything else is a file of the build (public/ and dist/) or nothing: an
    # address that is neither answers 404 with the branded page (error_page
    # above), not the app with a 200.
    location / {
        try_files $uri =404;
    }
}
