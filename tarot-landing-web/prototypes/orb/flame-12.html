<!doctype html>
<!--
  Flame — a real-time fractal flame.

  A chaos game iterates points through affine transforms with nonlinear variations, scatters
  them into a density histogram, and log-density tonemaps the result. The thin translucent
  overlapping sheets are the histogram itself, which is why no surface or volume renderer
  produces them. Structure after Scott Draves' flam3 / Apophysis / Chaotica.

  The bloom downsample tap spacing (a quarter of a destination texel, so bilinear covers the
  whole source footprint instead of aliasing) is taken from ThreeUI Community —
  https://github.com/MengTo/threeui

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Flame — Now Playing</title>
<style>
  :root {
    --accent: #ff4fd8;
    --accent2: #7b5cff;
    --fg: rgba(255,251,246,0.93);
    --fg-dim: rgba(255,248,240,0.52);
    --fg-faint: rgba(255,248,240,0.24);
    --line: rgba(255,246,235,0.13);
    --panel: rgba(255,248,240,0.055);
    --frost: rgba(255,248,240,0.05);
    --frost-hi: rgba(255,248,240,0.10);
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: #05040a; color: var(--fg); font-family: var(--sans); overflow: hidden; overscroll-behavior: none; }
  body { -webkit-user-select: none; user-select: none; }

  #orb, #orb2d { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; background: #000; }
  #orb.dragging { cursor: grabbing; }

  /* ---------- chrome ---------- */
  .ui { position: fixed; z-index: 2; pointer-events: none; }
  .ui > * { pointer-events: auto; }

  #top { left: 0; right: 0; top: 0; padding: calc(18px + var(--safe-t)) calc(22px + env(safe-area-inset-right, 0px)) 26px calc(22px + env(safe-area-inset-left, 0px)); background: linear-gradient(to bottom, rgba(0,0,0,0.34), rgba(0,0,0,0)); display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .eyebrow { font-size: 10px; letter-spacing: 0.26em; text-transform: uppercase; color: var(--fg-dim); margin: 0 0 6px; }
  #title { font-size: clamp(20px, 4.6vw, 34px); font-weight: 600; letter-spacing: -0.015em; margin: 0; line-height: 1.12; transition: opacity .18s; overflow-wrap: anywhere; hyphens: auto; }
  #title.swap { opacity: 0; }
  #subtitle { margin: 6px 0 0; font-size: 12px; color: var(--fg-dim); letter-spacing: 0.04em; }

  #stats { text-align: right; font-family: var(--mono); font-size: 11px; color: var(--fg-dim); line-height: 1.5; white-space: nowrap; }
  #stats b { color: var(--fg); font-weight: 500; }
  #stats .warn { color: #ffb36b; }
  #stats .tag { display: inline-block; margin-top: 4px; padding: 1px 6px; border: 1px solid var(--line); border-radius: 999px; font-size: 10px; color: var(--fg-dim); }

  #toast { left: 50%; top: calc(86px + var(--safe-t)); transform: translateX(-50%) translateY(-6px); background: rgba(20,16,28,0.85); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; font-family: var(--mono); font-size: 11px; color: var(--fg); opacity: 0; transition: opacity .3s, transform .3s; backdrop-filter: blur(10px); }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  #bottom { left: 0; right: 0; bottom: 0; padding: 30px calc(22px + env(safe-area-inset-right, 0px)) calc(18px + var(--safe-b)) calc(22px + env(safe-area-inset-left, 0px)); background: linear-gradient(to top, rgba(0,0,0,0.42) 30%, rgba(0,0,0,0)); display: flex; flex-direction: column; gap: 14px; }

  #progress { display: flex; align-items: center; gap: 12px; font-family: var(--mono); font-size: 11px; color: var(--fg-dim); }
  /* padding + content-box clip gives the 3px-looking bar a 23px tall touch target */
  #bar { flex: 1; height: 3px; padding: 10px 0; background: rgba(255,248,240,0.16); background-clip: content-box; border-radius: 3px; cursor: pointer; position: relative; box-sizing: content-box; touch-action: none; }
  #bar:focus-visible { outline: 2px solid var(--accent); outline-offset: 6px; }
  #fill { height: 3px; width: 0%; background: linear-gradient(90deg, var(--accent2), var(--accent)); border-radius: 3px; transition: background .8s; }

  #transport { display: flex; justify-content: center; align-items: center; gap: 22px; }
  .btn { appearance: none; background: transparent; border: 0; color: var(--fg); width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; transition: background .2s, transform .15s; }
  .btn:hover { background: rgba(255,248,240,0.09); }
  .btn:active { transform: scale(0.94); }
  .btn svg { width: 22px; height: 22px; fill: currentColor; }
  #play { width: 64px; height: 64px; background: rgba(255,250,244,0.94); color: #100c08; box-shadow: 0 6px 30px rgba(0,0,0,0.32); }
  #play:hover { background: #fffdfa; }
  #play svg { width: 26px; height: 26px; }
  #play .pause { display: none; }
  #play.playing .play { display: none; }
  #play.playing .pause { display: block; }

  /* the ends fade, so a row that continues past the edge reads as continuing rather than as
     stopping in the middle of nothing */
  #tracks { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 6px; scrollbar-width: none; -webkit-overflow-scrolling: touch;
            scroll-snap-type: x proximity; overscroll-behavior-x: contain;
            -webkit-mask-image: linear-gradient(to right, transparent 0, #000 18px, #000 calc(100% - 34px), transparent 100%);
            mask-image: linear-gradient(to right, transparent 0, #000 18px, #000 calc(100% - 34px), transparent 100%); }
  .chip { scroll-snap-align: center; }
  #tracks::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; border: 1px solid var(--line); background: var(--frost); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); color: var(--fg-dim); padding: 9px 15px; border-radius: 999px; font-size: 12px; letter-spacing: 0.01em; cursor: pointer; transition: color .3s, border-color .3s, background .3s; font-family: var(--sans); }
  .chip:hover { color: var(--fg); background: var(--frost-hi); }
  .chip.active { color: var(--fg); border-color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, transparent); }

  /* ---------- tuning panel ---------- */
  #tools { position: fixed; z-index: 3; left: calc(22px + env(safe-area-inset-left, 0px)); right: calc(22px + env(safe-area-inset-right, 0px)); bottom: calc(186px + var(--safe-b)); display: flex; gap: 8px; flex-wrap: wrap; }
  #tools button { appearance: none; border: 1px solid var(--line); background: var(--frost); color: var(--fg-dim); padding: 8px 13px; border-radius: 999px; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); font-family: var(--sans); transition: color .3s, background .3s, border-color .3s; }
  #tools button:hover, #tools button.on { color: var(--fg); background: var(--frost-hi); border-color: rgba(255,246,235,0.32); }
  #reactBtn[aria-pressed="true"] { color: #fff; border-color: var(--accent); background: color-mix(in srgb, var(--accent) 22%, transparent); }
  .chip.user { border-color: var(--accent); }
  .chip.demo { border-style: dashed; }
  #drop { position: fixed; inset: 0; z-index: 5; display: none; place-items: center; background: rgba(4,2,10,0.82); backdrop-filter: blur(6px); pointer-events: none; }
  #drop.on { display: grid; }
  #drop div { border: 2px dashed var(--accent); border-radius: 20px; padding: 34px 46px; font-size: 15px; letter-spacing: 0.04em; color: var(--fg); }
  #tuneBtnLegacy { position: fixed; z-index: 3; left: 22px; bottom: calc(170px + var(--safe-b)); appearance: none; border: 1px solid var(--line); background: rgba(12,10,18,0.55); color: var(--fg-dim); padding: 7px 12px; border-radius: 999px; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer; backdrop-filter: blur(10px); font-family: var(--sans); }
  #tuneBtnLegacy:hover { color: var(--fg); }

  #panel { position: fixed; z-index: 3; right: 16px; top: calc(80px + var(--safe-t)); width: 268px; max-height: calc(100vh - 300px); overflow-y: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px 10px; backdrop-filter: blur(22px) saturate(1.2); -webkit-backdrop-filter: blur(22px) saturate(1.2); box-shadow: 0 8px 40px rgba(0,0,0,0.35); transform: translateX(12px); opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .25s, transform .25s, visibility 0s .25s; }
  #panel.open { opacity: 1; transform: none; pointer-events: auto; visibility: visible; transition-delay: 0s; }
  #panel h3 { margin: 0 0 10px; font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--fg-dim); font-weight: 500; display: flex; justify-content: space-between; align-items: center; }
  #panel h3 button { appearance: none; border: 0; background: transparent; color: var(--fg-dim); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer; padding: 2px 4px; font-family: var(--sans); }
  #panel h3 button:hover { color: var(--fg); }
  .row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 6px 10px; margin: 0 0 8px; }
  .row label { font-size: 12px; color: var(--fg); }
  .row output { font-family: var(--mono); font-size: 11px; color: var(--fg-dim); }
  .row input[type=range] { grid-column: 1 / -1; width: 100%; margin: 0; height: 22px; appearance: none; -webkit-appearance: none; background: transparent; cursor: pointer; }
  .row input[type=range]::-webkit-slider-runnable-track { height: 2px; background: rgba(255,255,255,0.18); border-radius: 2px; }
  .row input[type=range]::-moz-range-track { height: 2px; background: rgba(255,255,255,0.18); border-radius: 2px; }
  .row input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #fff; margin-top: -7px; box-shadow: 0 0 0 3px rgba(0,0,0,0.4); }
  .row input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border: 0; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px rgba(0,0,0,0.4); }
  .meta { margin-top: 6px; padding-top: 8px; border-top: 1px solid var(--line); font-family: var(--mono); font-size: 10px; color: var(--fg-dim); line-height: 1.6; word-break: break-all; }

  /* landscape phone: the panel would not fit beside the orb, so dock it top-right and shrink it */
  /* A short window spends a quarter of its height on the transport if left alone; tighten it so
     the orb keeps being the hero. */
  @media (max-height: 720px) and (min-width: 641px) {
    #play { width: 54px; height: 54px; }
    .btn { width: 38px; height: 38px; }
    #bottom { gap: 10px; padding-top: 20px; }
    #top { padding-bottom: 14px; }
  }
  @media (max-height: 620px) and (max-width: 640px) {
    #play { width: 50px; height: 50px; }
    #bottom { gap: 8px; padding-top: 16px; }
    #tracks { padding-bottom: 2px; }
    .chip { padding: 7px 12px; font-size: 11px; }
  }

  /* Landscape phone: stacking the chrome above and below would leave the orb a sliver, so the
     layout splits instead — controls in a left column, orb in the right half. */
  @media (max-height: 520px) and (orientation: landscape) {
    #top { right: 54%; }
    #top #stats { display: none; }
    #bottom { right: 54%; gap: 8px; }
    #tools { top: calc(96px + var(--safe-t)); bottom: auto; left: calc(22px + env(safe-area-inset-left, 0px)); max-width: 42%; }
    #panel { top: calc(8px + var(--safe-t)); max-height: calc(100vh - 70px); width: 230px; }
    #transport { justify-content: flex-start; gap: 18px; padding-left: 4px; }
    #play { width: 50px; height: 50px; }
    .btn { width: 38px; height: 38px; }
    #title { font-size: 24px; }
    .chip { padding: 6px 11px; font-size: 11px; }
  }
  @media (max-height: 520px) and (orientation: portrait) {
    #play { width: 52px; height: 52px; }
  }
  /* Portrait phone. The readout moves above the title so the title gets the full width instead of
     being squeezed into a column beside it — that was what pushed a long name onto five lines. */
  @media (max-width: 640px) {
    #panel { right: 12px; left: 12px; width: auto; top: auto; bottom: calc(214px + var(--safe-b)); max-height: 38vh; }
    #tools { bottom: calc(178px + var(--safe-b)); left: 14px; right: 14px; }
    #top { padding: calc(10px + var(--safe-t)) 18px 10px; flex-direction: column-reverse; align-items: stretch; gap: 5px; }
    #stats { text-align: left; font-size: 10px; line-height: 1.45; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
    #stats > div, #stats > span { white-space: nowrap; }
    #stats #build { flex-basis: 100%; }
    #stats #build { margin-top: 0; }
    #title { font-size: clamp(17px, 5.9vw, 27px); }
    .eyebrow { display: none; }
    #subtitle { margin-top: 3px; font-size: 11px; }
    #progress { gap: 9px; }
    #transport { gap: 18px; }
    #play { width: 58px; height: 58px; }
    .btn { width: 40px; height: 40px; }
    #bottom { gap: 9px; padding-top: 18px; padding-bottom: calc(12px + var(--safe-b)); }
    #bottom { padding: 0 18px calc(14px + var(--safe-b)); }
    #stats .tag { display: none; }
  }

  /* ---------- no-webgl fallback ---------- */
  #stats #fallbackNote { display: none; }
  body.fallback #stats #fallbackNote { display: inline-block; }

  @media (prefers-reduced-motion: reduce) {
    #title, #fill, .chip, #panel, #toast { transition: none; }
  }
</style>

<!-- ================= SHADERS =================
  A fractal flame: a chaos game iterating points through affine transforms with nonlinear
  variations, scattered into a density histogram, then log-density tonemapped and coloured
  from a palette indexed by transform. The translucent overlapping sheets come from the
  histogram, which is why no surface or volume renderer can produce them.
-->
<script id="vs-quad" type="x-shader/x-vertex">#version 300 es
const vec2 q[3] = vec2[3](vec2(-1.0,-1.0), vec2(3.0,-1.0), vec2(-1.0,3.0));
void main(){ gl_Position = vec4(q[gl_VertexID], 0.0, 1.0); }
</script>

<script id="lib" type="x-shader/x-lib">
uint pcg(inout uint s){ s = s*747796405u + 2891336453u; uint w = ((s >> ((s >> 28u) + 4u)) ^ s) * 277803737u; return (w >> 22u) ^ w; }
float rnd(inout uint s){ return float(pcg(s)) * (1.0/4294967296.0); }

// ---- flam3 variations. Each maps the plane to the plane; the mix of them is what gives a
// flame its character, and animating the weights is what makes the structure morph. ----
vec2 vLinear(vec2 p){ return p; }
vec2 vSpherical(vec2 p){ return p/(dot(p,p)+1e-6); }
vec2 vSwirl(vec2 p){ float r=dot(p,p); float s=sin(r), c=cos(r); return vec2(p.x*s-p.y*c, p.x*c+p.y*s); }
vec2 vPolar(vec2 p){ return vec2(atan(p.x,p.y)*0.31830989, length(p)-1.0); }
vec2 vDisc(vec2 p){ float a=atan(p.x,p.y)*0.31830989; float r=length(p)*3.14159265; return a*vec2(sin(r),cos(r)); }
vec2 vSpiral(vec2 p){ float r=length(p)+1e-6; float a=atan(p.y,p.x); return vec2(cos(a)+sin(r), sin(a)-cos(r))/r; }
vec2 vHyperbolic(vec2 p){ float r=length(p)+1e-6; float a=atan(p.x,p.y); return vec2(sin(a)/r, r*cos(a)); }
vec2 vHandkerchief(vec2 p){ float r=length(p); float a=atan(p.x,p.y); return r*vec2(sin(a+r), cos(a-r)); }
vec2 vEyefish(vec2 p){ return p*(2.0/(length(p)+1.0)); }
vec2 vBubble(vec2 p){ return p*(4.0/(dot(p,p)+4.0)); }
vec2 vCurl(vec2 p, float c1, float c2){
  float t1 = 1.0 + c1*p.x + c2*(p.x*p.x - p.y*p.y);
  float t2 = c1*p.y + 2.0*c2*p.x*p.y;
  float d = 1.0/(t1*t1 + t2*t2 + 1e-6);
  return d*vec2(p.x*t1 + p.y*t2, p.y*t1 - p.x*t2);
}
vec2 vJulia(vec2 p, inout uint s){
  float r = sqrt(length(p) + 1e-9);
  float a = atan(p.y,p.x)*0.5 + (rnd(s) < 0.5 ? 0.0 : 3.14159265);
  return r*vec2(cos(a), sin(a));
}
// the faint square lattice that drifts through the reference frames
vec2 vRectangles(vec2 p, vec2 k){
  return vec2((2.0*floor(p.x/k.x) + 1.0)*k.x - p.x, (2.0*floor(p.y/k.y) + 1.0)*k.y - p.y);
}
</script>

<!-- one chaos-game step for every point, in parallel -->
<script id="fs-update" type="x-shader/x-fragment">#version 300 es
precision highp float; precision highp int;
__LIB__
uniform sampler2D uState;
uniform int   uSize;
uniform mat3  uAff[NT];
uniform vec4  uV1[NT];      // linear, spherical, swirl, polar
uniform vec4  uV2[NT];      // disc, spiral, hyperbolic, curl
uniform vec4  uV3[NT];      // julia, rectangles, eyefish, handkerchief
uniform vec4  uMeta[NT];    // colour index, cdf, curl c1, curl c2
uniform vec2  uGridK;
uniform float uSym;
uniform float uSymP;
uniform uint  uSeed;
out vec4 outState;
void main(){
  ivec2 ip = ivec2(gl_FragCoord.xy);
  vec4 st = texelFetch(uState, ip, 0);
  vec2 p = st.xy; float ci = st.z; uint rs = floatBitsToUint(st.w);
  if (rs == 0u) rs = (uint(ip.x) + uint(ip.y)*uint(uSize))*2654435761u + uSeed + 1u;

  // Restart a point if its orbit died or drifted off, and refresh a trickle of them every
  // frame so the sample set keeps exploring instead of settling into fixed cycles.
  bool bad = !(dot(p,p) < 1e8);
  if (bad || rnd(rs) < 0.0035) { p = vec2(rnd(rs), rnd(rs))*2.0 - 1.0; ci = rnd(rs); }

  float pick = rnd(rs);
  if (pick < uSymP) {
    // Symmetry is its own transform and leaves the colour index alone, which is how flam3 does
    // it. Rotating on every iteration instead would smear every colour through every arm and
    // the whole image would average to one cream tone.
    float k2 = floor(rnd(rs)*uSym);
    float ang = 6.28318530718*k2/uSym;
    float cs = cos(ang), sn = sin(ang);
    p = vec2(p.x*cs - p.y*sn, p.x*sn + p.y*cs);
  } else {
    float pk = (pick - uSymP)/max(1.0 - uSymP, 1e-4);
    int j = 0;
    for (int k = 0; k < NT; k++){ if (pk <= uMeta[k].y) { j = k; break; } }
    vec2 q = (uAff[j]*vec3(p, 1.0)).xy;
    vec4 a = uV1[j], b = uV2[j], c = uV3[j];

<!-- scatter every point into the density histogram -->
<script id="vs-scatter" type="x-shader/x-vertex">#version 300 es
precision highp float; precision highp int;
__LIB__
uniform sampler2D uState;
uniform sampler2D uPal;
uniform float uCiShift;
uniform vec4  uFlare[4];      // xy = radius, amplitude; z = width
uniform vec4  uTrail[10];     // xy = position in disc space, z = strength, w = radius
uniform vec3  uTrailK;        // push, curl, glow
uniform int   uTrailN, uFlareN;
uniform int   uSize;
uniform mat3  uFin;
uniform vec2  uFinW;        // linear vs bubble weight on the final transform
uniform vec2  uAsp;

  int i = gl_VertexID;
  ivec2 uv = ivec2(i % uSize, i / uSize);

  vec2 p = uFinW.x*vLinear(h) + uFinW.y*vBubble(h);

  // and swirled, so the filaments part around a finger and curl back rather than a shape being
  // stamped on top. Displacing where a sample lands is what makes it behave like a fluid.
  float trailLum = 0.0;
  for (int i = 0; i < 10; i++) {
    if (i >= uTrailN) break;
    if (uTrail[i].z <= 0.001) continue;

    float rad = uTrail[i].w;

  // deposits, never its position, so the flame keeps its exact shape and size — light moves through
  // the arms instead of the orb pumping.
  float rr = length(p);

    if (i >= uFlareN) break;

    float d = (rr - uFlare[i].x)/uFlare[i].z;

    hot += uFlare[i].y*g;

<!-- log-density tonemap: the step that turns a histogram into a flame -->
<script id="fs-tone" type="x-shader/x-fragment">#version 300 es
precision highp float;
uniform sampler2D uT;
uniform float uExp, uGamma, uSat, uVig;
out vec4 o;
void main(){
  vec4 a = texelFetch(uT, ivec2(gl_FragCoord.xy), 0);
  float d = a.a;
  if (d <= 1e-9) { o = vec4(0.0,0.0,0.0,1.0); return; }
  // alpha = log(1+d)/d is the flame tonemap: sparse filaments stay visible while dense
  // cores roll off slowly, which is what makes overlapping sheets read as translucent
  float l = log(1.0 + d*uExp)/d;
  vec3 c = max(a.rgb*l, 0.0);
  // Roll the highlights off on luminance and keep the ratio between channels, so a bright
  // filament goes pale without going white and the palette survives into the core.
  float lum = dot(c, vec3(0.2126,0.7152,0.0722));
  float rolled = lum/(1.0 + lum);
  c *= lum > 1e-5 ? rolled/lum : 1.0;
  lum = dot(c, vec3(0.2126,0.7152,0.0722));
  c = mix(vec3(lum), c, uSat);
  c = pow(clamp(c, 0.0, 1.0), vec3(1.0/uGamma));
  o = vec4(c, 1.0);
}
</script>

  // Everything here is kept far below the flame's own brightness so nothing competes with it.

  // roughly 0.135 in the corners rising to 0.31 behind the orb. Measured, not eyeballed — the
  // first version of this sat at 0.03 and read as pure black on anything but a gold palette.
  vec3 c = uBgCol*(0.125 + 0.105*fall)*uAmbient;

  // half-height at each column is the audio envelope scrolling left to right, and it is built from
  // four stacked gaussians at different scales rather than a stroke: a tight core that follows the
  // fine detail, then progressively wider, fainter haloes. That is what makes it read as light
  // with body rather than a drawn line.

    // the haze is soft light rather than a scaled-up copy of the same spikes

    // splits into two arcs that ride the silhouette, over the top and under the bottom, then
    // rejoin and carry on. Away from the orb the two arcs collapse back into one band.
    float Rk = max(uWaveK.y, 1.0);

    // separate infinitely fast there and leaves a hairline seam. A smooth bump curves the
    // band over and under the sphere with no such edge anywhere.
    float bulge = Rk*0.40*exp(-pow(dxp/(Rk*0.80), 2.0));

    float edge = smoothstep(0.0, 0.20, wx)*smoothstep(1.0, 0.80, wx);   // never reaches the edges

    // at the rim the band is lifted rather than cut, so its light runs into the orb's glow and
    // there is no seam where the two meet.
    float rr = length(gl_FragCoord.xy - uCentre)/Rk;
    band *= mix(0.22, 1.0, smoothstep(0.86, 1.05, rr));

    // the orb's own colours: the saturated middle of the ramp, not its near-white top

  // tested a rectangle here, and since the bloom is still bright at that boundary the glow was
  // chopped off along a straight square edge. Nothing on screen may have a straight edge.
  vec2 uv = (gl_FragCoord.xy - uOff)/uScale;

  o = vec4(c, 1.0);
}

    t.audio = 'file'; t.user = true; t.kind = 'Your file'; t.duration = Math.max(1, buf.duration);
    if (userIdx < 0) { userIdx = TRACKS.length; TRACKS.push(t); } else TRACKS[userIdx] = t;
    buildChips();
    audio.fileOffset = 0;
    setTrack(userIdx);
    toast(`${name} · ${fmtTime(buf.duration)} — press play`);
    if (state.playing) { audio.startFile(0); }
  } catch (err) {
    toast('Could not decode that file');
    console.error(err);
  }
}
const fileInput = $('fileInput');
fileInput.addEventListener('change', () => { loadUserFile(fileInput.files[0]); fileInput.value = ''; });
$('loadBtn').addEventListener('click', () => fileInput.click());

let dragDepth = 0;
const dropEl = $('drop');
window.addEventListener('dragenter', e => { e.preventDefault(); if (++dragDepth === 1) dropEl.classList.add('on'); });
window.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
window.addEventListener('dragleave', e => { e.preventDefault(); if (--dragDepth <= 0) { dragDepth = 0; dropEl.classList.remove('on'); } });
window.addEventListener('drop', e => {
  e.preventDefault(); dragDepth = 0; dropEl.classList.remove('on');
  const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) loadUserFile(f);
});

async function togglePlay() {
  if (state.playing) { state.playing = false; audio.pause(); }
  else { state.playing = true; state.playStart = performance.now() - state.elapsed*1000; const ok = await audio.play(); if (!ok) { state.playing = false; toast('Web Audio unavailable in this browser'); } }
  playBtn.classList.toggle('playing', state.playing);
  playBtn.setAttribute('aria-label', state.playing ? 'Pause' : 'Play');
}
playBtn.addEventListener('click', togglePlay);
$('prev').addEventListener('click', () => setTrack(state.trackIndex - 1));
$('next').addEventListener('click', () => setTrack(state.trackIndex + 1));
function seekTo(sec) {
  state.elapsed = clamp(sec, 0, TRACKS[state.trackIndex].duration);
  state.playStart = performance.now() - state.elapsed*1000;
  if (audio.source === 'file' && audio.fileBuf) {
    audio.stopFile();                       // stop first: it rewrites fileOffset from the old position
    audio.fileOffset = state.elapsed;
    if (state.playing) audio.startFile(state.elapsed);
  }
}
barEl.addEventListener('pointerdown', e => { const r = barEl.getBoundingClientRect(); seekTo(clamp((e.clientX - r.left)/r.width, 0, 1)*TRACKS[state.trackIndex].duration); barEl.focus(); });
barEl.addEventListener('keydown', e => {
  const dur = TRACKS[state.trackIndex].duration;
  const step = { ArrowRight: 5, ArrowLeft: -5, PageUp: 30, PageDown: -30 }[e.key];
  if (step !== undefined) seekTo(state.elapsed + step);
  else if (e.key === 'Home') seekTo(0);
  else if (e.key === 'End') seekTo(dur);
  else return;
  e.preventDefault(); e.stopPropagation();
});
document.addEventListener('keydown', e => {
  const t = e.target;
  // never steal keys from a focused control: Space must still activate a button, arrows must still move a slider
  if (t !== document.body && t.closest && t.closest('input, select, textarea, [contenteditable], [role=slider], button:focus-visible')) return;
  if (e.repeat) return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.code === 'ArrowRight') setTrack(state.trackIndex + 1);
  else if (e.code === 'ArrowLeft') setTrack(state.trackIndex - 1);
  else if (e.code === 'Escape' && $('panel').classList.contains('open')) { $('tuneBtn').click(); $('tuneBtn').focus(); }
});

// tuning panel
const slidersEl = $('sliders');
SLIDERS.forEach(([key, label, min, max, step]) => {
  const row = document.createElement('div'); row.className = 'row';
  row.innerHTML = `<label for="s-${key}">${label}</label><output id="o-${key}"></output><input id="s-${key}" type="range" min="${min}" max="${max}" step="${step}" value="${state.tune[key]}">`;
  slidersEl.appendChild(row);
  const inp = row.querySelector('input'), out = row.querySelector('output');
  const show = () => out.textContent = (+inp.value).toFixed(2);
  inp.addEventListener('input', () => { state.tune[key] = +inp.value; show(); if (key === 'react') syncReactBtn(); });
  show();
});
function syncSliders() { SLIDERS.forEach(([key]) => { const inp = $('s-' + key); inp.value = state.tune[key]; $('o-' + key).textContent = (+inp.value).toFixed(2); }); setReact(state.tune.react); }
$('reset').addEventListener('click', () => { Object.assign(state.tune, TUNE_DEFAULTS); syncSliders(); });
const reactBtn = $('reactBtn');
// the button and the slider are two views of one value, so each has to update the other
function syncReactBtn() {
  const v = state.tune.react;
  reactBtn.textContent = `React ×${v % 1 === 0 ? v : v.toFixed(1)}`;
  reactBtn.setAttribute('aria-pressed', v > 1.5);
}
function setReact(v) {
  state.tune.react = v;
  const inp = $('s-react'); if (inp) { inp.value = v; $('o-react').textContent = v.toFixed(2); }
  syncReactBtn();
}
// the toggle swings between the calm default and a deliberately overdone setting
reactBtn.addEventListener('click', () => setReact(state.tune.react > 1.5 ? 1.5 : 3.5));
function setPanel(on) {
  const panel = $('panel'), btn = $('tuneBtn');
  panel.classList.toggle('open', on);
  btn.classList.toggle('on', on);
  btn.setAttribute('aria-expanded', on);
  if ('inert' in panel) panel.inert = !on;
}
$('tuneBtn').addEventListener('click', () => setPanel(!$('panel').classList.contains('open')));
// There is only room for the panel beside the flame on a large window. Shrinking one — dragging a
// split divider, rotating a phone — used to leave it open across the whole screen with the flame
// hidden behind it, so the panel gets put away whenever the room disappears.
function panelHasRoom() { return window.innerWidth >= 900 && window.innerHeight >= 620; }
window.addEventListener('resize', () => { if (!panelHasRoom()) setPanel(false); });
// on a small screen, tapping the flame dismisses the panel
$('orb').addEventListener('pointerdown', () => { if (!panelHasRoom()) setPanel(false); });

const motionTag = $('motionTag');
function applyMotionPref() { state.motion = reduceMotionMQ.matches ? 0.35 : 1; motionTag.hidden = !reduceMotionMQ.matches; }
reduceMotionMQ.addEventListener ? reduceMotionMQ.addEventListener('change', applyMotionPref) : reduceMotionMQ.addListener(applyMotionPref);
applyMotionPref();

/* ---------------- main loop ---------------- */
let last = 0, lastPct = '', lastCur = '';
function frame(now) {
  requestAnimationFrame(frame);
  const raw = last ? (now - last)/1000 : 1/60; last = now;
  const dt = Math.min(raw, 0.1);
  layoutCache = null;
  const s = state;
  s.frameNo = (s.frameNo || 0) + 1;

  audio.analyse(dt);
  if (s.playing) { audio.schedulePulses(); audio.scheduleDemo(); }
  // beats throw flares; when nothing is playing the orb still breathes them out on its own so it
  // is never sitting completely still
  const beat = s.playing ? audio.detectBeat(dt) : 0;
  if (beat > 0) { addFlare(beat*s.tune.react*0.9); queueBeat(beat, s.clock); }
  s.nextIdle -= dt;
  if (s.nextIdle <= 0) {
    s.nextIdle = (s.motion < 1 ? 9 : 5) + Math.random()*(s.motion < 1 ? 7 : 5);
    if (beat === 0) { addFlare(0.25 + Math.random()*0.4); queueBeat(0.35, s.clock); }
  }
  updateFlares(dt);
  updateTrail(dt);
  if (gl && R) updateWave(dt);

  const speed = s.tune.speed*s.motion;
  s.clock += dt*s.motion;
  const tick = dt*s.motion*(0.35 + 0.65*s.tune.speed);
  s.swayT = (s.swayT + tick) % 6283.185307;
  s.charT += tick;
  // The flame's own clock. Audio nudges the rate a little; it never scales anything on a beat.
  s.flowTime += dt*speed*clamp(1.0 + (s.audio.level - 0.45)*0.45*s.tune.react, 0.25, 2.5);

  if (s.playing) {
    s.elapsed = (audio.source === 'file' && audio.fileBuf) ? audio.fileTime() : (performance.now() - s.playStart)/1000;
    const trk = TRACKS[s.trackIndex];
    if (s.elapsed >= trk.duration) {
      if (trk.user || trk.audio === 'demo') seekTo(0);
      else setTrack(s.trackIndex + 1);
    }
  }
  const tr = TRACKS[s.trackIndex];
  const frac = clamp(s.elapsed/tr.duration, 0, 1);
  const pct = (frac*100).toFixed(1) + '%';
  if (pct !== lastPct) { fillEl.style.width = lastPct = pct; barEl.setAttribute('aria-valuenow', Math.round(frac*100)); }
  const cur = fmtTime(s.elapsed);
  if (cur !== lastCur) { tCur.textContent = lastCur = cur; tTot.textContent = fmtTime(tr.duration); barEl.setAttribute('aria-valuetext', `${cur} of ${fmtTime(tr.duration)}`); }

  if (gl && R && !gl.isContextLost()) {
    if (canvas.width !== Math.round(canvas.clientWidth*R.dpr) || canvas.height !== Math.round(canvas.clientHeight*R.dpr)) resizeGL();
    drawFlame(dt);
    adapt(dt, raw);
  } else if (ctx2d) {
    draw2D(dt);
    perf.fpsAcc += raw; perf.fpsN++;
    if (perf.fpsAcc >= 0.5) { fpsEl.textContent = Math.round(perf.fpsN/perf.fpsAcc); perf.fpsAcc = 0; perf.fpsN = 0; }
  }
}

/* ---------------- boot ---------------- */
const BUILD = 'flame-12 · 2026-08-23 18:05';
window.ORB_BUILD = BUILD;
$('build').textContent = BUILD;
setReact(state.tune.react);
setTrack(0);
setPanel(panelHasRoom());
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); R = null; toast('Graphics context lost — restoring…'); }, false);
canvas.addEventListener('webglcontextrestored', () => { R = null; if (initGL()) { resizeGL(); toast('Graphics restored'); } else startFallback(); }, false);
if (initGL()) { resizeGL(); window.addEventListener('resize', () => { if (R) resizeGL(); }); }
else startFallback();
requestAnimationFrame(frame);

})();
</script>
</body>
</html>
